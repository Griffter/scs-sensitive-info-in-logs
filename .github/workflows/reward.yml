name: Reward Successful Exploit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reward:
    runs-on: ubuntu-latest
    env:
      FLAG: ${{ secrets.FLAG }}
      TAG_NAME: lab-${{ github.run_id }}
    steps:
      - name: Require lab flag
        run: test -n "$FLAG"

      - name: Create unique reward release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG_NAME" \
            -f target_commitish="main" \
            -f name="$TAG_NAME" \
            -f body="$FLAG"
